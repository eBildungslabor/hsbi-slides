<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Vernetzen. Austauschen. Gestalten.</title>
    <link rel="stylesheet" href="reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="reveal.js/dist/reveal.css" />
    <link
      rel="stylesheet"
      href="reveal.js/dist/theme/solarized.css"
      id="theme"
    />
    <link
      rel="stylesheet"
      href="reveal.js/plugin/highlight/monokai.css"
      id="highlight-theme"
    />
    <style>
      .timer-box {
        margin: 40px 0;
        padding: 30px;
        background: #f0f0f0;
        border-radius: 8px;
        font-size: 1.5em;
      }
      .timer-box strong {
        color: #0066cc;
        font-size: 1.4em;
      }
      .done {
        color: green;
        font-weight: bold;
        font-size: 2em;
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown
          data-separator="-----"
          data-separator-vertical="---"
        >
          <textarea data-template>
            # Vernetzen.
            # Austauschen.
            # Gestalten.
            Ein Prototyp zum Mitmachen.
            -----
            ## Schritt 1: Themensammlung
            Notiere auf einer Karte ein (möglichst konkretes) Thema oder eine Frage, die für dich im Kontext der Hochschullehre zurzeit besonders relevant ist.
            -----
            ## Schritt 2: Themenclusterung
            Bewegt euch durch den Raum und stellt euch in Paargesprächen Eure Themen vor!
            
            1. Beide finden ihr Thema wichtiger → Karten behalten.
            2. Beide finden das jeweils andere Thema wichtiger → Karten tauschen
            3. Beide finden ein Thema wichtiger als das andere → Mit dieser Karte als Gruppe weitermachen.
            -----
            ## Schritt 3: Sessionplanung
            Wir nehmen die am höchsten bewerteten Themen in unseren Sessionplan auf!
          </textarea>
        </section>
        <section>
          <div class="timer-box">
            Die ersten Sessions starten in <strong><span id="timer1"></span></strong> um 10:55 Uhr
          </div>
        </section>
        <section>
          <div class="timer-box">
            Die ersten Sessions enden in <strong><span id="timer2"></span></strong> um 11:15 Uhr
          </div>
        </section>
        <section>
          <div class="timer-box">
            Die zweiten Sessions starten in <strong><span id="timer3"></span></strong> um 11:25 Uhr
          </div>
        </section>
        <section>
          <div class="timer-box">
            Die zweiten Sessions enden in <strong><span id="timer4"></span></strong> um 11:45 Uhr
          </div>
        </section>
        <section data-markdown>
          <textarea data-template>
            ## Abschluss
            Was willst du teilen?
          </textarea>
        </section>
        <section data-markdown>
          <textarea data-template>
            ## Danke! ❤️
            Vernetzung und Inspirationen zu gutem Lernen im digitalen Wandel
            - Fediverse: @nele@fedilab.de
            - Web: ebildungslabor.de
          </textarea>
        </section>
      </div>
    </div>
    <script src="reveal.js/dist/reveal.js"></script>
    <script src="reveal.js/plugin/notes/notes.js"></script>
    <script src="reveal.js/plugin/markdown/markdown.js"></script>
    <script src="reveal.js/plugin/highlight/highlight.js"></script>
    <script src="reveal.js/plugin/zoom/zoom.js"></script>
    <script>
      Reveal.initialize({
        hash: true,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealZoom],
      });

      function createTimer(elementId, targetTime) {
        const element = document.getElementById(elementId);
        const [hours, minutes] = targetTime.split(':');
        const target = new Date();
        target.setHours(parseInt(hours), parseInt(minutes), 0, 0);
        
        let soundPlayed = false;
        
        function update() {
          const now = new Date();
          const diff = target - now;
          
          if (diff <= 0) {
            element.innerHTML = '<span class="done">jetzt!</span>';
            element.parentElement.style.background = '#d4edda';
            
            // Akustisches Signal beim Erreichen von 0
            if (!soundPlayed) {
              const audio = new Audio('gong.mp3');
              audio.play().catch(e => console.log('Audio play failed:', e));
              soundPlayed = true;
            }
            return;
          }
          
          const mins = Math.floor(diff / 60000);
          const secs = Math.floor((diff % 60000) / 1000);
          
          // Farbe ändern in letzter Minute
          if (mins === 0) {
            element.parentElement.querySelector('strong').style.color = '#cc0000';
          } else {
            element.parentElement.querySelector('strong').style.color = '#0066cc';
          }
          
          element.textContent = `${mins}:${secs.toString().padStart(2, '0')} Minuten`;
        }
        
        update();
        setInterval(update, 1000);
      }

      Reveal.on('ready', () => {
        createTimer('timer1', '10:55');
        createTimer('timer2', '11:15');
        createTimer('timer3', '11:25');
        createTimer('timer4', '21:45');
      });
    </script>
  </body>
</html>
