<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Vernetzen. Austauschen. Gestalten.</title>
    <link rel="stylesheet" href="reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="reveal.js/dist/reveal.css" />
    <link
      rel="stylesheet"
      href="reveal.js/dist/theme/solarized.css"
      id="theme"
    />
    <link
      rel="stylesheet"
      href="reveal.js/plugin/highlight/monokai.css"
      id="highlight-theme"
    />
    <style>
      .countdown {
        font-size: 2em;
        margin: 30px 0;
        padding: 20px;
        background: #f0f0f0;
        border-radius: 10px;
      }
      .countdown strong {
        color: #0066cc;
      }
      .signal {
        font-size: 3em;
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown
          data-separator="-----"
          data-separator-vertical="---"
        >
          <textarea data-template>
            # Vernetzen.
            # Austauschen.
            # Gestalten.
            Ein Prototyp zum Mitmachen.
            
            <div class="countdown" data-target="10:10" data-type="start"></div>
            -----
            ## Schritt 1: Themensammlung
            Notiere auf einer Karte ein (möglichst konkretes) Thema oder eine Frage, die für dich im Kontext der Hochschullehre zurzeit besonders relevant ist.
            -----
            ## Schritt 2: Themenclusterung
            Bewegt euch durch den Raum und stellt euch in Paargesprächen Eure Themen vor!
            
            1. Beide finden ihr Thema wichtiger → Karten behalten.
            2. Beide finden das jeweils andere Thema wichtiger → Karten tauschen
            3. Beide finden ein Thema wichtiger als das andere → Mit dieser Karte als Gruppe weitermachen.
            -----
            ## Schritt 3: Sessionplanung
            Wir nehmen die am höchsten bewerteten Themen in unseren Sessionplan auf!
            -----
            ## Slot 1
            Wähle dir ein Thema und begib dich an den angegebenen Ort, um darüber 20 Minuten lang mit Kolleg\*innen in einen Austausch zu gehen.
            
            <div class="countdown" data-target="11:45" data-type="start"></div>
            -----
            ## Slot 1
            
            <div class="countdown" data-target="12:05" data-type="end"></div>
            -----
            ## Slot 2
            Wähle dir ein Thema und begib dich an den angegebenen Ort, um darüber 20 Minuten lang mit Kolleg\*innen in einen Austausch zu gehen.
            
            <div class="countdown" data-target="12:15" data-type="start"></div>
            -----
            ## Slot 2
            
            <div class="countdown" data-target="12:35" data-type="end"></div>
            -----
            ## Abschluss
            Was willst du teilen?
            -----
            ## Danke! ❤️
            Vernetzung und Inspirationen zu gutem Lernen im digitalen Wandel
            - Fediverse: @nele@fedilab.de
            - Web: ebildungslabor.de
          </textarea>
        </section>
      </div>
    </div>
    <script src="reveal.js/dist/reveal.js"></script>
    <script src="reveal.js/plugin/notes/notes.js"></script>
    <script src="reveal.js/plugin/markdown/markdown.js"></script>
    <script src="reveal.js/plugin/highlight/highlight.js"></script>
    <script src="reveal.js/plugin/zoom/zoom.js"></script>
    <script>
      Reveal.initialize({
        hash: true,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealZoom],
      });

      // Timer-Funktion
      function startCountdowns() {
        document.querySelectorAll('.countdown').forEach(element => {
          const targetTime = element.getAttribute('data-target');
          const type = element.getAttribute('data-type');
          
          const [hours, minutes] = targetTime.split(':');
          const target = new Date();
          target.setHours(parseInt(hours), parseInt(minutes), 0, 0);
          
          function update() {
            const now = new Date();
            const diff = target - now;
            
            if (diff <= 0) {
              if (type === 'start') {
                element.innerHTML = '<span class="signal">🔔 START!</span>';
              } else {
                element.innerHTML = '<span class="signal">⏰ ENDE!</span>';
              }
              return;
            }
            
            const mins = Math.floor(diff / 60000);
            const secs = Math.floor((diff % 60000) / 1000);
            
            if (type === 'start') {
              element.innerHTML = `Noch <strong>${mins}:${secs.toString().padStart(2, '0')} min</strong> bis zum Start`;
            } else {
              element.innerHTML = `Noch <strong>${mins}:${secs.toString().padStart(2, '0')} min</strong> bis zum Ende`;
            }
          }
          
          update();
          setInterval(update, 1000);
        });
      }

      // Starte Timer nach dem Reveal.js geladen ist
      Reveal.on('ready', startCountdowns);
    </script>
  </body>
</html>
